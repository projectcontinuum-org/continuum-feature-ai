name: Release

on:
  release:
    types: [published]

jobs:
  # Worker base image (Claude Code CLI + shell tools + python3) that Jib builds the worker on.
  # Only rebuilt when docker/agent-worker-base differs from main; otherwise the worker reuses :latest.
  worker-base-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BASE_IMAGE: projectcontinuum/continuum-feature-ai-worker-base
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes against main
        id: changes
        run: |
          version=$(grep '^featureVersion=' gradle.properties | cut -d= -f2)
          if git diff --quiet origin/main HEAD -- docker/agent-worker-base; then
            echo "docker/agent-worker-base unchanged from main, reusing ${BASE_IMAGE}:latest"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "image=${BASE_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "image=${BASE_IMAGE}:${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push worker base image
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/agent-worker-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:${{ steps.changes.outputs.version }}
            ${{ env.BASE_IMAGE }}:latest

  release:
    needs: worker-base-image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Libraries → Maven Central
          - module: features:continuum-feature-unsloth
            publish_to_maven: true
            publish_to_docker_hub: false
          - module: features:continuum-feature-claude
            publish_to_maven: true
            publish_to_docker_hub: false
          # Services → Docker Hub
          - module: worker
            publish_to_maven: false
            publish_to_docker_hub: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew :${{ matrix.module }}:build --no-daemon

      - name: Publish to local staging
        if: matrix.publish_to_maven
        run: ./gradlew :${{ matrix.module }}:publish --no-daemon
        env:
          MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Deploy to Maven Central via JReleaser
        if: matrix.publish_to_maven
        run: ./gradlew :${{ matrix.module }}:jreleaserDeploy --no-daemon
        env:
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}

      - name: Push container image to Docker Hub
        if: matrix.publish_to_docker_hub
        run: ./gradlew :${{ matrix.module }}:jib -PworkerBaseImage=${{ needs.worker-base-image.outputs.image }} --no-daemon
        env:
          DOCKER_REPO_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_REPO_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
