# ============================================================
# Development overrides for continuum-feature-ai
# Usage: helm install continuum-feature-ai ./charts/continuum-feature-ai -f charts/continuum-feature-ai/values-dev.yaml -n continuum-dev --create-namespace
# ============================================================

global:
  imagePullPolicy: Always

continuum:
  secrets:
    minio:
      rootUser: "dev-minio-root"
      rootPassword: "dev-minio-secret"

  featureAi:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    autoscaling:
      enabled: false
